name: WAR CI and Image Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/war-tomcat-cicd-lab

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR package
        run: mvn -B package

      - name: Verify WAR exists
        run: test -f target/war-tomcat-cicd-lab.war

      - name: Save WAR as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-package-${{ github.sha }}
          path: target/war-tomcat-cicd-lab.war

      - name: Build container image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push $IMAGE_NAME:${{ github.sha }}
